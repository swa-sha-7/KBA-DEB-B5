<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black h-screen flex items-center justify-center">

<div class="flex w-full h-screen">

    <div class="w-1/2 relative hidden md:block">
        <img src="/bgimg/bg2.jpg" alt="Car" class="w-full h-full object-cover" />
        <h1 class="absolute bottom-10 left-10 text-white text-4xl font-semibold opacity-80">Car Rental</h1>
    </div>

    <div class="w-full md:w-1/2 bg-gray-950 flex items-center justify-center relative">
        <a href="/Home.html" class="absolute top-4 right-4 text-white text-2xl hover:text-red-500 transition duration-200">&times;</a>

        <div class="bg-gray-800 p-8 rounded-lg w-80 shadow-lg">
            <h2 class="text-2xl font-bold text-white mb-6">Register</h2>

            <form>
            <!-- Username -->
            <div class="mb-4">
                <label class="block text-gray-300 text-sm mb-1" for="username">Username <span class="text-red-500">*</span></label>
                <input type="text" id="username" class="w-full px-3 py-2 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter username" required />
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-gray-300 text-sm mb-1" for="password">Password <span class="text-red-500">*</span></label>
                <input type="password" id="password" class="w-full px-3 py-2 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Enter password" required />
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label class="block text-gray-300 text-sm mb-1" for="confirm">Confirm Password <span class="text-red-500">*</span></label>
                <input type="password" id="confirm" class="w-full px-3 py-2 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Confirm password" required />
            </div>

            <!-- Register Button -->
            <button type="submit" class="w-full bg-purple-500 text-white py-2 rounded hover:bg-purple-600 transition">Register</button>
            </form>

            <!-- Login Link -->
            <p class="text-gray-400 text-sm mt-4 text-center">
                <a href="/Login.html" class="hover:underline">Click Here to Login</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
